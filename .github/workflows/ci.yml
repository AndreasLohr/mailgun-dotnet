name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build + test + pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink needs full history for the commit-sha embed.

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o ./artifacts

      - name: Upload nupkgs
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg

  build-net8-only:
    name: build on .NET 8 SDK only (analyzer-gap guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately install ONLY the .NET 8 SDK so we exercise the .NET 8 analyzer baseline
      # in isolation. The main "build" job installs both SDKs and lets `dotnet` pick the higher
      # one (.NET 10), which masks CA rules that .NET 8 enforces but .NET 10 has relaxed
      # (e.g. CA1859, CA1716 — see Directory.Build.props and tests/Mailgun.Tests/Mailgun.Tests.csproj).
      - name: Setup .NET 8 SDK only
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      # Pass TargetFrameworks=net8.0 so we don't try to compile the net10.0 target with an SDK
      # that doesn't know about it. This is purely a "does the .NET 8 analyzer pass cleanly?" job.
      - name: Build (net8.0 only)
        run: dotnet build -c Release --no-restore -p:TargetFrameworks=net8.0

      - name: Test (net8.0 only)
        run: dotnet test tests/Mailgun.Tests/Mailgun.Tests.csproj -c Release --no-build -p:TargetFrameworks=net8.0 --verbosity normal

  mutation:
    name: mutation test (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker.NET
        run: dotnet stryker

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput/
